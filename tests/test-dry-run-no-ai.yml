name: Test dry-run with no-ai does not modify changelog
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Seed a changelog file
        run: |
          mkdir -p act-dryrun-test
          printf '# Changelog\n\n' > act-dryrun-test/CHANGELOG.md
          sha256sum act-dryrun-test/CHANGELOG.md > /tmp/changelog-before.sha
      - id: action
        uses: .
        with:
          changelog-path: act-dryrun-test/CHANGELOG.md
          release-tag: HEAD
          release-name: 1.2.3
          dry-run: 'true'
          no-ai: 'true'
      - name: Assert action succeeded and changelog is unchanged
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          cat act-dryrun-test/CHANGELOG.md
          if ! sha256sum -c /tmp/changelog-before.sha; then
            echo "FAIL: dry-run modified the changelog file"
            exit 1
          fi
          echo "PASS"
