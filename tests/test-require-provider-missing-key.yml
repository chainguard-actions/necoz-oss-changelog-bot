name: Test require-provider fails when API key is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ''
          OPENAI_API_KEY: ''
        with:
          provider: openai
          require-provider: 'true'
          fail-on-llm-error: 'true'
          no-ai: 'false'
          release-tag: HEAD
          release-name: 9.9.9-test
          dry-run: 'true'
      - name: Assert action failed due to missing provider key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when OPENAI_API_KEY is missing and require-provider is true"
            exit 1
          fi
          echo "PASS"
