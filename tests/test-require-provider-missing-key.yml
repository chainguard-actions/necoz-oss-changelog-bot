name: Test require-provider fails when provider API key is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Seed a changelog file
        run: |
          mkdir -p act-reqprov-test
          printf '# Changelog\n\n' > act-reqprov-test/CHANGELOG.md
      - id: action
        uses: .
        continue-on-error: true
        env:
          OPENAI_API_KEY: ''
        with:
          changelog-path: act-reqprov-test/CHANGELOG.md
          provider: openai
          release-tag: HEAD
          release-name: 0.0.1
          dry-run: 'true'
          no-ai: 'false'
          require-provider: 'true'
      - name: Assert action failed because the API key is missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when require-provider is true and OPENAI_API_KEY is missing"
            exit 1
          fi
          echo "PASS"
