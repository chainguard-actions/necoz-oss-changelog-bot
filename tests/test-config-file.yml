name: Test config-path file is honored (dry-run, no-ai via config)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Seed a changelog file
        run: |
          mkdir -p act-config-test
          printf '# Changelog\n\n' > act-config-test/CHANGELOG.md
          sha256sum act-config-test/CHANGELOG.md > /tmp/changelog-config-before.sha
          cat > act-config-test/changelog-bot.config.json <<'EOF'
          {
            "language": "en",
            "audience": "user",
            "noAi": true,
            "dryRun": true
          }
          EOF
          cat act-config-test/changelog-bot.config.json
      - id: action
        uses: .
        with:
          config-path: act-config-test/changelog-bot.config.json
          changelog-path: act-config-test/CHANGELOG.md
          release-tag: HEAD
          release-name: 2.0.0
          dry-run: 'true'
          no-ai: 'true'
      - name: Assert action succeeded and changelog is unchanged
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! sha256sum -c /tmp/changelog-config-before.sha; then
            echo "FAIL: dry-run modified the changelog file"
            exit 1
          fi
          echo "PASS"
